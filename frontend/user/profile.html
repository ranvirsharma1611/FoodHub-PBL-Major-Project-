<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Profile & Addresses - FoodHub</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body>

  <div class="app-layout">
    <div id="app-sidebar-container"></div>

    <div class="app-main">
      <div id="app-topbar-container"></div>

      <div class="content-body">
        <div class="page-header">
          <div>
            <h1 class="page-title">Profile & Delivery Locations</h1>
            <p class="page-subtitle">Manage multiple delivery addresses and account security settings</p>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1.5fr; gap: 2rem;">
          <!-- Profile Info Form -->
          <div class="table-card" style="padding: 1.75rem;">
            <h3 style="font-size: 1.15rem; font-weight: 800; color: var(--color-text-dark); margin-bottom: 1.25rem;">
              <i class="fa-solid fa-user text-primary"></i> Personal Information
            </h3>

            <form onsubmit="handleProfileUpdate(event)">
              <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" id="prof-name" class="form-control" value="Aarav Sharma" required>
              </div>

              <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" id="prof-email" class="form-control" value="aarav@example.com" required>
              </div>

              <div class="form-group">
                <label class="form-label">Phone Number</label>
                <input type="tel" id="prof-phone" class="form-control" value="+91 98765 00001" required>
              </div>

              <button type="submit" class="btn btn-primary btn-block">
                <i class="fa-solid fa-floppy-disk"></i>
                <span>Save Profile Changes</span>
              </button>
            </form>
          </div>

          <!-- Saved Delivery Addresses -->
          <div class="table-card" style="padding: 1.75rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;">
              <h3 style="font-size: 1.15rem; font-weight: 800; color: var(--color-text-dark);">
                <i class="fa-solid fa-location-dot text-primary"></i> Saved Addresses
              </h3>
              <button class="btn btn-outline btn-sm" onclick="addNewAddressPrompt()">
                <i class="fa-solid fa-plus"></i> Add Address
              </button>
            </div>

            <div style="display: flex; flex-direction: column; gap: 1rem;" id="address-cards-list">
              <!-- Address 1: Default -->
              <div style="border: 1.5px solid var(--color-primary); background: var(--color-primary-light); border-radius: var(--radius-md); padding: 1.25rem; display: flex; justify-content: space-between; align-items: flex-start;">
                <div>
                  <span class="badge badge-primary" style="margin-bottom: 0.35rem;">Default Home</span>
                  <strong style="display: block; font-size: 0.95rem; color: var(--color-text-dark);">12 MP Nagar, Zone 1</strong>
                  <p class="text-sm text-muted">Bhopal, Madhya Pradesh - 462011</p>
                </div>
                <span class="text-primary font-bold text-xs"><i class="fa-solid fa-circle-check"></i> Active</span>
              </div>

              <!-- Address 2: Work -->
              <div style="border: 1px solid var(--color-border); background: #ffffff; border-radius: var(--radius-md); padding: 1.25rem; display: flex; justify-content: space-between; align-items: flex-start;">
                <div>
                  <span class="badge badge-info" style="margin-bottom: 0.35rem;">Work / Office</span>
                  <strong style="display: block; font-size: 0.95rem; color: var(--color-text-dark);">Tech Park, Hoshangabad Rd</strong>
                  <p class="text-sm text-muted">Bhopal, Madhya Pradesh - 462026</p>
                </div>
                <button class="btn btn-outline btn-sm" onclick="makeDefaultAddress('Tech Park')">Set as Default</button>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      UI.initPortalLayout('user', 'profile');
    });

    function handleProfileUpdate(e) {
      e.preventDefault();
      const name = document.getElementById('prof-name').value;
      const email = document.getElementById('prof-email').value;
      const phone = document.getElementById('prof-phone').value;

      localStorage.setItem('foodhub_user', JSON.stringify({ name, email, phone }));
      UI.showToast('Profile updated in MySQL database!', 'success', 'fa-circle-check');
    }

    function makeDefaultAddress(addrName) {
      UI.showToast(`Set ${addrName} as your default delivery address!`, 'success', 'fa-location-dot');
    }

    function addNewAddressPrompt() {
      const addr = prompt('Enter your new street address and locality:', 'Flat 204, Green Meadows, Kolar Road, Bhopal');
      if (addr) {
        UI.showToast(`Added new address: ${addr}`, 'success', 'fa-plus');
      }
    }
  </script>
</body>
</html>
